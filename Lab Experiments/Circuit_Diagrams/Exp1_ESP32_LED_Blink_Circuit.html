<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exp 1 Circuit — Blinking of LED using ESP32 Microcontroller</title>
<style>
body { font-family: Arial, sans-serif; background: #f8f9fa; display: flex; justify-content: center; padding: 20px; }
.card { background: white; border-radius: 10px; box-shadow: 0 2px 12px #0002; padding: 24px; max-width: 720px; width: 100%; }
h2 { color: #1F4E79; border-bottom: 3px solid #1F4E79; padding-bottom: 8px; font-size: 1.1em; }
h3 { color: #1F4E79; font-size: 0.95em; margin: 18px 0 6px; }
svg { width: 100%; border: 1px solid #dce6f0; border-radius: 6px; background: #fafcff; }
.connections { background: #EBF3FB; border-radius: 6px; padding: 12px 16px; font-size: 0.88em; }
.connections li { margin: 4px 0; font-family: Courier New, monospace; }
</style></head>
<body><div class="card">
<h2>Experiment 1 — Circuit Diagram</h2>
<h3>Blinking of LED using ESP32 Microcontroller</h3>
<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
  <!-- ESP32 board -->
  <rect x="40" y="60" width="180" height="140" rx="8" fill="#1A3A5C" stroke="#00B4D8" stroke-width="2"/>
  <text x="130" y="82" text-anchor="middle" fill="#00B4D8" font-size="13" font-weight="bold">ESP32</text>
  <!-- GPIO2 pin -->
  <circle cx="220" cy="110" r="5" fill="#FFB703"/>
  <text x="200" y="107" text-anchor="end" fill="white" font-size="11">GPIO2</text>
  <!-- GND pin -->
  <circle cx="220" cy="160" r="5" fill="#aaa"/>
  <text x="200" y="157" text-anchor="end" fill="white" font-size="11">GND</text>
  <!-- Wire GPIO2 to resistor -->
  <line x1="225" y1="110" x2="290" y2="110" stroke="#FFB703" stroke-width="2.5"/>
  <!-- Resistor -->
  <rect x="290" y="100" width="60" height="20" rx="4" fill="#e8d5a3" stroke="#8B7355" stroke-width="2"/>
  <text x="320" y="114" text-anchor="middle" font-size="10" fill="#4a3728">220Ω</text>
  <!-- Wire resistor to LED -->
  <line x1="350" y1="110" x2="400" y2="110" stroke="#FFB703" stroke-width="2.5"/>
  <!-- LED body -->
  <ellipse cx="420" cy="110" rx="18" ry="14" fill="#ff4444" stroke="#cc0000" stroke-width="2" opacity="0.9"/>
  <text x="420" y="114" text-anchor="middle" font-size="10" fill="white" font-weight="bold">LED</text>
  <!-- LED legs -->
  <line x1="400" y1="110" x2="402" y2="110" stroke="#cc0000" stroke-width="2"/>
  <line x1="438" y1="110" x2="460" y2="110" stroke="#555" stroke-width="2"/>
  <!-- Wire LED to GND rail -->
  <line x1="460" y1="110" x2="500" y2="110" stroke="#555" stroke-width="2"/>
  <line x1="500" y1="110" x2="500" y2="160" stroke="#555" stroke-width="2"/>
  <!-- Wire GND ESP32 to GND rail -->
  <line x1="225" y1="160" x2="500" y2="160" stroke="#555" stroke-width="2"/>
  <!-- GND symbol -->
  <line x1="500" y1="165" x2="500" y2="185" stroke="#555" stroke-width="2"/>
  <line x1="486" y1="185" x2="514" y2="185" stroke="#555" stroke-width="2.5"/>
  <line x1="490" y1="190" x2="510" y2="190" stroke="#555" stroke-width="1.5"/>
  <line x1="494" y1="195" x2="506" y2="195" stroke="#555" stroke-width="1"/>
  <!-- Labels -->
  <text x="320" y="95" text-anchor="middle" font-size="10" fill="#555">220 Ω</text>
  <text x="420" y="135" text-anchor="middle" font-size="9" fill="#cc0000">LED+  LED-</text>
  <text x="505" y="175" font-size="10" fill="#333">GND</text>
  <!-- Glow effect on LED -->
  <ellipse cx="420" cy="110" rx="22" ry="18" fill="none" stroke="#ff6666" stroke-width="1" opacity="0.4"/>
</svg>
<h3>Circuit Connections</h3>
<div class="connections"><ul><li>ESP32 GPIO2 ──→ 220Ω resistor ──→ LED Anode (+)</li><li>LED Cathode (−) ──→ GND</li></ul></div>
<p style="font-size:0.8em;color:#888;margin-top:16px">PEMRT525 IoT &amp; Applications Lab | JECC | S5 MR 2K24</p>
</div></body></html>
